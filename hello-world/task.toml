version = "1.0"

[task]
name = "codimango/hello-world"
description = "Train a linear regression model and produce predictions — minimal ML-Bench example."
authors = [{ name = "ML-Bench Template", email = "" }]
keywords = ["ml", "auto-research", "linear-regression", "hello-world", "cpu-native"]

[metadata]
author_name = "ML-Bench Template"
author_email = ""
difficulty = "easy"
category = "ml"
tags = ["ml", "auto-research", "linear-regression", "hello-world"]
expert_time_estimate_min = 5.0
junior_time_estimate_min = 15.0
seed = 42
deterministic = true

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 300.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 4096
gpus = 0
allow_internet = true
